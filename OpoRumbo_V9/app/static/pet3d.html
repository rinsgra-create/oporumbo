<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>
<script>
(function(){
  if(typeof THREE==='undefined'){
    parent.postMessage({type:'pet3dFailed'},'*');
    return;
  }

  const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(34,1,.1,30);
  camera.position.set(0,.45,5.7);
  camera.lookAt(0,.35,0);

  scene.add(new THREE.HemisphereLight(0xffffff,0x55784e,2.8));
  const key=new THREE.DirectionalLight(0xffffff,3.4);key.position.set(4,5,5);scene.add(key);
  const rim=new THREE.DirectionalLight(0x7bc9ff,1.8);rim.position.set(-4,2,-2);scene.add(rim);

  const ground=new THREE.Mesh(
    new THREE.CylinderGeometry(1.45,1.7,.18,48),
    new THREE.MeshStandardMaterial({color:0x7aa26b,roughness:.95})
  );
  ground.position.y=-1.03;
  scene.add(ground);

  let root,head,body,tail,earL,earR,eyes=[];
  let currentPet='auri',currentStage=1,reaction=null,reactionStart=0;
  let nextBlink=performance.now()+1800;

  const palettes={
    auri:{main:0xf5e3c8,second:0xcbe9ff,dark:0x3c5c80,eye:0x48c9ef,accent:0xffd669},
    nexo:{main:0x29497e,second:0x45d0cf,dark:0x152b53,eye:0x67f2ec,accent:0x78f4ee},
    bruma:{main:0xddd5f5,second:0xb8a5ec,dark:0x5f5082,eye:0xc4aaff,accent:0xf0e7ff}
  };

  function mat(c){return new THREE.MeshStandardMaterial({color:c,roughness:.68})}
  function ball(r,c,sx=1,sy=1,sz=1){
    const m=new THREE.Mesh(new THREE.SphereGeometry(r,28,20),mat(c));
    m.scale.set(sx,sy,sz);
    return m;
  }
  function cone(r,h,c){return new THREE.Mesh(new THREE.ConeGeometry(r,h,20),mat(c))}
  function clear(){
    if(!root)return;
    scene.remove(root);
    root.traverse(o=>{
      if(o.geometry)o.geometry.dispose();
      if(o.material)o.material.dispose?.();
    });
  }

  function build(type='auri',stage=1){
    clear();
    currentPet=type;currentStage=stage;
    const p=palettes[type]||palettes.auri;

    root=new THREE.Group();root.position.y=-.32;scene.add(root);

    body=ball(.72,p.main,1,.98,.9);body.position.y=.02;root.add(body);
    head=ball(.67,p.main,1.05,1,.96);head.position.y=.9;root.add(head);

    const muzzle=ball(.30,0xfff8ef,1.15,.72,.72);muzzle.position.set(0,.67,.60);head.add(muzzle);

    earL=cone(.31,.78,p.main);earR=cone(.31,.78,p.main);
    earL.position.set(-.43,.62,.02);earR.position.set(.43,.62,.02);
    earL.rotation.z=-.12;earR.rotation.z=.12;head.add(earL,earR);

    const il=cone(.16,.50,p.second),ir=cone(.16,.50,p.second);
    il.position.set(-.43,.62,.14);ir.position.set(.43,.62,.14);
    il.rotation.z=-.12;ir.rotation.z=.12;head.add(il,ir);

    eyes=[];
    [-.25,.25].forEach(x=>{
      const g=new THREE.Group();
      const w=ball(.14,0xffffff,1,1.12,.56),iris=ball(.078,p.eye,1,1.03,.45),pu=ball(.034,0x102544,1,1,.4);
      iris.position.z=.085;pu.position.z=.125;g.add(w,iris,pu);g.position.set(x,.93,.59);head.add(g);eyes.push(g);
    });

    const nose=ball(.065,p.dark,1.15,.72,.65);nose.position.set(0,.68,.84);head.add(nose);
    const pawL=ball(.26,p.second,1,.64,1.05),pawR=ball(.26,p.second,1,.64,1.05);
    pawL.position.set(-.39,-.55,.38);pawR.position.set(.39,-.55,.38);root.add(pawL,pawR);

    tail=new THREE.Group();
    const t1=ball(.31,p.second,1.35,.72,.72),t2=ball(.27,p.main,1.28,.68,.68);
    t1.position.x=.48;t2.position.set(.90,.11,0);tail.add(t1,t2);tail.position.set(.48,-.12,-.20);root.add(tail);

    const gem=ball(.14,p.accent,1,.9,.45);gem.position.set(0,.13,.69);root.add(gem);

    if(type==='nexo'){
      for(let i=0;i<3;i++){const s=cone(.12,.34,p.second);s.position.set(0,.55-i*.32,-.60);s.rotation.x=-Math.PI/2;root.add(s)}
    }
    if(type==='bruma'){
      const wl=ball(.34,p.second,1.15,1.42,.48),wr=ball(.34,p.second,1.15,1.42,.48);
      wl.position.set(-.58,.12,-.05);wr.position.set(.58,.12,-.05);wl.rotation.z=.22;wr.rotation.z=-.22;root.add(wl,wr);
    }
    if(stage>=3){const crest=cone(.14,.42,p.second);crest.position.set(0,1.50,-.03);root.add(crest)}
    if(stage>=4){
      const wl=cone(.33,.92,p.second),wr=cone(.33,.92,p.second);
      wl.position.set(-.72,.30,-.28);wr.position.set(.72,.30,-.28);wl.rotation.z=1.05;wr.rotation.z=-1.05;root.add(wl,wr);
    }
    if(stage>=5){
      const halo=new THREE.Mesh(new THREE.TorusGeometry(.42,.035,8,38),new THREE.MeshBasicMaterial({color:p.accent}));
      halo.position.set(0,1.65,0);halo.rotation.x=Math.PI/2;root.add(halo);
    }
    const sc=stage===1?.88:stage===2?.94:stage===3?1:stage===4?1.06:1.12;root.scale.setScalar(sc);
  }

  function resize(){
    const w=innerWidth,h=innerHeight;
    renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
  }
  addEventListener('resize',resize);resize();

  function react(kind){reaction=kind;reactionStart=performance.now()}

  function loop(){
    requestAnimationFrame(loop);
    const now=performance.now(),t=now/1000;
    if(root){
      body.scale.y=.98*(1+Math.sin(t*2.1)*.018);
      head.rotation.y=Math.sin(t*.75)*.045;
      head.rotation.z=Math.sin(t*.52)*.018;
      earL.rotation.z=-.12+Math.sin(t*1.3)*.03;
      earR.rotation.z=.12-Math.sin(t*1.3)*.03;
      tail.rotation.z=.18+Math.sin(t*2.5)*.18;

      if(now>nextBlink){
        eyes.forEach(g=>g.scale.y=.08);
        setTimeout(()=>eyes.forEach(g=>g.scale.y=1),130);
        nextBlink=now+1800+Math.random()*3000;
      }

      if(reaction){
        const p=Math.min(1,(now-reactionStart)/850);
        root.position.y=-.32+Math.sin(p*Math.PI)*.28;
        root.rotation.z=Math.sin(p*Math.PI*2)*.055;
        if(p>=1){reaction=null;root.position.y=-.32;root.rotation.z=0}
      }
    }
    renderer.render(scene,camera);
  }

  addEventListener('message',ev=>{
    const d=ev.data||{};
    if(d.type==='setPet')build(d.pet||'auri',d.stage||1);
    if(d.type==='react')react(d.reaction||'eat');
  });

  build('auri',1);
  loop();
  parent.postMessage({type:'pet3dReady'},'*');
})();
</script>
</body>
</html>
